[project]
name = "aqi-prediction-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for an AI-powered Air Quality Monitoring System."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "email-validator>=2.2.0",
    "earthengine-api>=1.0.0",
    "fastapi>=0.111.0",
    "gunicorn>=22.0.0",
    "numpy>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.2",
    "requests>=2.32.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "tensorflow>=2.16.0",
    "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
